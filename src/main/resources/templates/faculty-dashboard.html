<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Dashboard - ProjectHub ECE</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            ProjectHub ECE
        </span>

        <form action="/logout" method="post">
            <button class="btn btn-outline-light">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5">

    <h1>Faculty Dashboard</h1>

    <p class="text-muted">
        Welcome to ProjectHub ECE Faculty Portal
    </p>

    <div class="row mt-4">

        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Student Projects</h5>
                    <p>
                        Review and monitor student projects.
                    </p>

                    <a href="/projects"
                       class="btn btn-primary">
                        View Projects
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Feedback</h5>
                    <p>
                        Provide feedback on student projects.
                    </p>

                    <a href="/feedback"
                       class="btn btn-success">
                        Give Feedback
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>

</html>
