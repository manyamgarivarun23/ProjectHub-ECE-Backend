<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects - ProjectHub ECE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            ProjectHub ECE
        </a>

        <a href="/logout" class="btn btn-outline-light">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Projects</h2>

        <a href="/projects/new" class="btn btn-primary">
            + Create Project
        </a>
    </div>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="project : ${projects}">

            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <h5 class="card-title">
                     <a th:href="@{/projects/{id}(id=${project.id})}"
                         th:text="${project.title}"
                         class="text-decoration-none">
                         Project Title

                    </h5>

                    <p class="text-muted"
                       th:text="${project.domain}">
                        Domain
                    </p>

                    <p class="card-text"
                       th:text="${project.description}">
                        Project description
                    </p>

                    <span class="badge bg-secondary"
                          th:text="${project.status}">
                        DRAFT
                    </span>

                </div>

            </div>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(projects)}"
         class="alert alert-info">

        No projects have been created yet.

    </div>

</div>

</body>
</html>
