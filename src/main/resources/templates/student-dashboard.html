<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - ProjectHub ECE</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            ProjectHub ECE
        </span>

        <form action="/logout" method="post">
            <button class="btn btn-outline-light">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5">

    <h1>Student Dashboard</h1>

    <p class="text-muted">
        Welcome to ProjectHub ECE
    </p>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Create Project</h5>
                    <p>Create and manage your ECE project.</p>
                    <a href="/projects/new"
                       class="btn btn-primary">
                        Create Project
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>My Projects</h5>
                    <p>View your existing projects.</p>
                    <a href="/projects"
                       class="btn btn-success">
                        View Projects
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Components</h5>
                    <p>Manage project components.</p>
                    <a href="/components"
                       class="btn btn-warning">
                        Components
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>

</html>
