<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Feedback - ProjectHub ECE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            ProjectHub ECE
        </a>

        <form action="/logout" method="post">
            <button class="btn btn-outline-light">
                Logout
            </button>
        </form>

    </div>
</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Faculty Feedback</h2>

        <a href="/dashboard"
           class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>


    <!-- Give Feedback -->

    <div class="card shadow-sm mb-5">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Give Feedback on Student Project
            </h5>

            <form action="/feedback"
                  method="post">


                <!-- Project -->

                <div class="mb-3">

                    <label class="form-label">
                        Select Project
                    </label>

                    <select name="projectId"
                            class="form-select"
                            required>

                        <option value="">
                            -- Select Project --
                        </option>

                        <option th:each="project : ${projects}"
                                th:value="${project.id}"
                                th:text="${project.title}">
                        </option>

                    </select>

                </div>


                <!-- Comments -->

                <div class="mb-3">

                    <label class="form-label">
                        Comments
                    </label>

                    <textarea name="comments"
                              class="form-control"
                              rows="5"
                              placeholder="Enter your feedback..."
                              required></textarea>

                </div>


                <!-- Status -->

                <div class="mb-4">

                    <label class="form-label">
                        Review Status
                    </label>

                    <select name="status"
                            class="form-select"
                            required>

                        <option value="PENDING">
                            Pending
                        </option>

                        <option value="APPROVED">
                            Approved
                        </option>

                        <option value="NEEDS_REVISION">
                            Needs Revision
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn btn-success">
                    Submit Feedback
                </button>

            </form>

        </div>

    </div>


    <!-- Feedback Management -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Submitted Feedback
            </h5>


            <!-- No Feedback -->

            <div th:if="${#lists.isEmpty(feedbackList)}"
                 class="alert alert-info">

                No feedback has been submitted yet.

            </div>


            <!-- Feedback Table -->

            <div th:if="${!#lists.isEmpty(feedbackList)}"
                 class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Project ID</th>

                        <th>Faculty ID</th>

                        <th>Comments</th>

                        <th>Status</th>

                        <th>Update Status</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="feedback : ${feedbackList}">

                        <td th:text="${feedback.id}">
                            1
                        </td>


                        <td th:text="${feedback.projectId}">
                            1
                        </td>


                        <td th:text="${feedback.facultyId}">
                            1
                        </td>


                        <td th:text="${feedback.comments}">
                            Feedback comments
                        </td>


                        <td>

                            <span class="badge bg-primary"
                                  th:text="${feedback.status}">
                                PENDING
                            </span>

                        </td>


                        <td>

                            <form action="/feedback/status"
                                  method="post"
                                  class="d-flex gap-2">

                                <input type="hidden"
                                       name="feedbackId"
                                       th:value="${feedback.id}">


                                <select name="status"
                                        class="form-select form-select-sm">

                                    <option value="PENDING"
                                            th:selected="${feedback.status == 'PENDING'}">
                                        Pending
                                    </option>

                                    <option value="APPROVED"
                                            th:selected="${feedback.status == 'APPROVED'}">
                                        Approved
                                    </option>

                                    <option value="NEEDS_REVISION"
                                            th:selected="${feedback.status == 'NEEDS_REVISION'}">
                                        Needs Revision
                                    </option>

                                </select>


                                <button type="submit"
                                        class="btn btn-primary btn-sm">
                                    Update
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>

</body>
</html>
