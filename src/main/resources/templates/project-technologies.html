<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Technologies - ProjectHub ECE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            ProjectHub ECE
        </a>

        <a href="/logout" class="btn btn-outline-light">
            Logout
        </a>

    </div>
</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Project Technologies</h2>

        <a th:href="@{/projects/{id}(id=${projectId})}"
           class="btn btn-secondary">
            Back to Project
        </a>

    </div>


    <!-- Add Technology -->

    <div class="card shadow-sm mb-4">

        <div th:if="${param.error != null and param.error[0] == 'duplicate'}"
             class="alert alert-warning">
            This technology is already added to this project.
        </div>

        <div class="card-body">

            <h5 class="card-title mb-3">
                Add Technology
            </h5>

            <form action="/projects/technologies/add"
                  method="post">

                <input type="hidden"
                       name="projectId"
                       th:value="${projectId}">

                <div class="row align-items-end">

                    <div class="col-md-9">

                        <label class="form-label">
                            Technology
                        </label>

                        <select name="technologyId"
                                class="form-select"
                                required>

                            <option value="">
                                -- Select Technology --
                            </option>

                            <option th:each="technology : ${technologies}"
                                    th:value="${technology.id}"
                                    th:text="${technology.name}">
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <button type="submit"
                                class="btn btn-warning w-100">
                            Add Technology
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- Current Technologies -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h5 class="card-title mb-3">
                Technologies Used in Project
            </h5>


            <div th:if="${#lists.isEmpty(projectTechnologies)}"
                 class="alert alert-info">

                No technologies have been added yet.

            </div>


            <table th:if="${!#lists.isEmpty(projectTechnologies)}"
                   class="table table-bordered">

                <thead class="table-dark">

                <tr>
                    <th>Technology Name</th>
                    <th>Category</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="pt : ${projectTechnologies}">

                    <td th:text="${pt.technologyName}">
                        Technology Name
                    </td>

                    <td th:text="${pt.category}">
                        Category
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
