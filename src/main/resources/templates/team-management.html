<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Management - ProjectHub ECE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            ProjectHub ECE
        </a>

        <a href="/logout" class="btn btn-outline-light">
            Logout
        </a>

    </div>
</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Team Management</h2>

        <a th:href="@{/projects/{id}(id=${projectId})}"
           class="btn btn-secondary">
            Back to Project
        </a>

    </div>


    <!-- Add Team Member -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="card-title">
                Add Team Member
            </h5>

            <form action="/projects/team/add"
                  method="post">

                <input type="hidden"
                       name="projectId"
                       th:value="${projectId}">

                <div class="row align-items-end">

                    <div class="col-md-9">

                        <label class="form-label">
                            Select Student
                        </label>

                        <select name="studentId"
                                class="form-select"
                                required>

                            <option value="">
                                -- Select Student --
                            </option>

                            <option th:each="student : ${students}"
                                    th:value="${student.id}"
                                    th:text="${student.name + ' (' + student.email + ')'}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Add Member
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- Current Team Members -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h5 class="card-title mb-3">
                Current Team Members
            </h5>

            <div th:if="${#lists.isEmpty(members)}"
                 class="alert alert-info">

                No team members added yet.

            </div>


            <table th:if="${!#lists.isEmpty(members)}"
                   class="table table-bordered">

                <thead class="table-dark">

                <tr>
                    <th>Member ID</th>
                    <th>Student ID</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="member : ${members}">

                    <td th:text="${member.id}">
                        1
                    </td>

                    <td th:text="${member.studentId}">
                        1
                    </td>
                    <td>

                     <form action="/projects/team/remove"
                     method="post">

                     <input type="hidden"
                       name="projectId"
                      th:value="${projectId}">

                     <input type="hidden"
                     name="memberId"
                     th:value="${member.id}">

                     <button type="submit"
                     class="btn btn-danger btn-sm">
                     Remove
                     </button>

                     </form>

                      </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
