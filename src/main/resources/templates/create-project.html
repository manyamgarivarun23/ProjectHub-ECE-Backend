<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project - ProjectHub ECE</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            ProjectHub ECE
        </span>

        <a href="/dashboard" class="btn btn-outline-light">
            Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Create New Project
                    </h2>

                    <form action="/projects" method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Project Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter project title"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Project Domain
                            </label>

                            <input
                                type="text"
                                name="domain"
                                class="form-control"
                                placeholder="Example: IoT, Embedded Systems, VLSI"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Project Abstract
                            </label>

                            <textarea
                                name="projectAbstract"
                                class="form-control"
                                rows="5"
                                placeholder="Enter project abstract"
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Project Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="6"
                                placeholder="Describe your project"
                                required></textarea>

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Create Project
                            </button>

                            <a
                                href="/dashboard"
                                class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
