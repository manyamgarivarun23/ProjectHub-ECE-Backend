<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Testing Results - ProjectHub ECE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            ProjectHub ECE
        </a>

        <a href="/logout" class="btn btn-outline-light">
            Logout
        </a>

    </div>
</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Testing Results</h2>

        <a th:href="@{/projects/{id}(id=${projectId})}"
           class="btn btn-secondary">
            Back to Project
        </a>

    </div>


    <!-- Add Testing Result -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Add Testing Result
            </h5>

            <form action="/projects/testing/add"
                  method="post">

                <input type="hidden"
                       name="projectId"
                       th:value="${projectId}">


                <!-- Test Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Test Name
                    </label>

                    <input type="text"
                           name="testName"
                           class="form-control"
                           placeholder="Example: Sensor Accuracy Test"
                           required>

                </div>


                <!-- Test Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Test Date
                    </label>

                    <input type="date"
                           name="testDate"
                           class="form-control">

                </div>


                <!-- Result -->

                <div class="mb-3">

                    <label class="form-label">
                        Result
                    </label>

                    <select name="result"
                            class="form-select"
                            required>

                        <option value="">
                            -- Select Result --
                        </option>

                        <option value="PASS">
                            PASS
                        </option>

                        <option value="FAIL">
                            FAIL
                        </option>

                        <option value="PARTIAL">
                            PARTIAL
                        </option>

                    </select>

                </div>


                <!-- Remarks -->

                <div class="mb-4">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea name="remarks"
                              class="form-control"
                              rows="4"
                              placeholder="Enter test observations or remarks..."></textarea>

                </div>


                <button type="submit"
                        class="btn btn-success">
                    Add Test Result
                </button>

            </form>

        </div>

    </div>


    <!-- Existing Testing Results -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Testing History
            </h5>


            <!-- No Tests -->

            <div th:if="${#lists.isEmpty(testingList)}"
                 class="alert alert-info">

                No testing results have been added yet.

            </div>


            <!-- Testing Table -->

            <div th:if="${!#lists.isEmpty(testingList)}"
                 class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>Test Name</th>
                        <th>Test Date</th>
                        <th>Result</th>
                        <th>Remarks</th>
                        <th>Action</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="testing : ${testingList}">

                        <td th:text="${testing.testName}">
                            Sensor Accuracy Test
                        </td>


                        <td th:text="${testing.testDate}">
                            2026-10-06
                        </td>


                        <td>

                            <span th:if="${testing.result == 'PASS'}"
                                  class="badge bg-success">
                                PASS
                            </span>

                            <span th:if="${testing.result == 'FAIL'}"
                                  class="badge bg-danger">
                                FAIL
                            </span>

                            <span th:if="${testing.result == 'PARTIAL'}"
                                  class="badge bg-warning text-dark">
                                PARTIAL
                            </span>

                        </td>


                        <td th:text="${testing.remarks}">
                            Test remarks
                        </td>


                        <td>

                            <form action="/projects/testing/delete"
                                  method="post">

                                <input type="hidden"
                                       name="id"
                                       th:value="${testing.id}">

                                <input type="hidden"
                                       name="projectId"
                                       th:value="${projectId}">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>

</body>
</html>
